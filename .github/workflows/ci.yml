name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm format:check
      - run: mise exec -- pnpm lint
      - run: mise exec -- pnpm typecheck
      - run: mise exec -- pnpm test
      - run: mise exec -- pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: cf-sync
          path: |
            packages/obsidian-plugin/dist/main.js
            packages/obsidian-plugin/dist/manifest.json
          if-no-files-found: error
