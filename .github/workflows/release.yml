name: Release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm typecheck
      - run: mise exec -- pnpm lint
      - run: mise exec -- pnpm test
      - run: mise exec -- pnpm build
      - name: Check tag matches manifest
        run: node --input-type=module -e 'import fs from "node:fs"; if(JSON.parse(fs.readFileSync("packages/obsidian-plugin/manifest.json")).version !== process.env.RELEASE_TAG) process.exit(1)'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Create release
        run: gh release create "$RELEASE_TAG" packages/obsidian-plugin/dist/main.js packages/obsidian-plugin/dist/manifest.json --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
