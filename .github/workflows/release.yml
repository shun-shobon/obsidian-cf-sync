name: Release
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter @cf-sync/obsidian-plugin build
      - name: Check tag matches manifest
        run: node --input-type=module -e 'import fs from "node:fs"; if(JSON.parse(fs.readFileSync("packages/obsidian-plugin/dist/manifest.json")).version !== process.env.RELEASE_TAG) process.exit(1)'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Create release
        run: gh release create "$RELEASE_TAG" packages/obsidian-plugin/dist/main.js packages/obsidian-plugin/dist/manifest.json --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
